<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>HBS CRM — Reconnecting</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 100vw; height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  .box {
    text-align: center;
    max-width: 420px;
    padding: 40px 32px;
    background: #1e293b;
    border-radius: 20px;
    border: 1px solid #334155;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  }
  .logo-wrap {
    width: 64px; height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
    box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
  }
  .logo-wrap svg { width: 32px; height: 32px; stroke: #fff; }
  h1 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 8px; }
  p { font-size: 14px; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 9999px;
    background: rgba(239, 68, 68, 0.15);
    color: #f87171;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 20px;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ef4444;
    animation: blink 1.5s infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .btn-retry {
    background: #3b82f6;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    transition: all 0.15s ease;
  }
  .btn-retry:hover { background: #2563eb; box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5); }
  .countdown { font-size: 12px; color: #64748b; margin-top: 14px; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
        <line x1="12" y1="2" x2="12" y2="12"></line>
      </svg>
    </div>
    <div class="status-pill">
      <span class="dot"></span>
      <span>Connection Lost</span>
    </div>
    <h1>Unable to reach server</h1>
    <p>Please check your internet connection or verify if the server is starting up. Reconnecting automatically...</p>
    <button class="btn-retry" id="btnRetry">Retry Connection</button>
    <div class="countdown" id="countdown">Auto-retrying in 5s...</div>
  </div>
  <script>
    function triggerReload() {
      if (window.offlineBridge) window.offlineBridge.reload();
      else window.location.reload();
    }
    let timeLeft = 5;
    const countEl = document.getElementById('countdown');
    const timer = setInterval(() => {
      timeLeft--;
      if (timeLeft <= 0) {
        clearInterval(timer);
        triggerReload();
      } else {
        countEl.textContent = `Auto-retrying in ${timeLeft}s...`;
      }
    }, 1000);

    document.getElementById('btnRetry').addEventListener('click', () => {
      clearInterval(timer);
      triggerReload();
    });
  </script>
</body>
</html>
