<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: transparent;
    overflow: hidden;
  }
  .card {
    width: 100%; height: 100%;
    background: #ffffff;
    border-radius: 16px;
    border: 1px solid #d7e6ff;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    padding: 28px 26px 20px;
    -webkit-app-region: drag;
  }
  .icon-wrap {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4f8cff, #2f6fed);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 16px;
    box-shadow: 0 6px 16px rgba(47,111,237,0.35);
    -webkit-app-region: no-drag;
  }
  .icon-wrap svg { width: 26px; height: 26px; }
  h1 {
    font-size: 17px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 8px;
    -webkit-app-region: no-drag;
  }
  p {
    font-size: 13.5px;
    line-height: 1.55;
    color: #6b6b6b;
    flex: 1;
    -webkit-app-region: no-drag;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    margin-top: 18px;
    -webkit-app-region: no-drag;
  }
  button {
    -webkit-app-region: no-drag;
    border: none;
    border-radius: 10px;
    padding: 10px 22px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:active { transform: scale(0.97); }
  #restart {
    background: linear-gradient(135deg, #4f8cff, #2f6fed);
    color: #fff;
    box-shadow: 0 6px 14px rgba(47,111,237,0.35);
  }
  #restart:hover { box-shadow: 0 8px 18px rgba(47,111,237,0.45); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
      </svg>
    </div>
    <h1>Update Ready</h1>
    <p>A new version has been downloaded. The app needs to restart to finish updating.</p>
    <div class="actions">
      <button id="restart">Restart Now</button>
    </div>
  </div>
  <script>
    document.getElementById('restart').addEventListener('click', () => window.updateAlert.restartNow());
    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') window.updateAlert.restartNow(); });
  </script>
</body>
</html>
