<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Idle Time Alert</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: transparent;
    overflow: hidden;
    user-select: none;
  }
  .card {
    width: 100%; height: 100%;
    background: #ffffff;
    border-radius: 16px;
    border: 1px solid #fed7aa;
    box-shadow: 0 20px 50px rgba(0,0,0,0.22);
    display: flex;
    flex-direction: column;
    padding: 24px 24px 20px;
    -webkit-app-region: drag;
  }
  .icon-wrap {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f97316, #ea580c);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 14px;
    box-shadow: 0 6px 16px rgba(234,88,12,0.35);
    -webkit-app-region: no-drag;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .icon-wrap svg { width: 24px; height: 24px; stroke: #fff; }
  h1 {
    font-size: 16px;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 6px;
    -webkit-app-region: no-drag;
  }
  p {
    font-size: 13px;
    line-height: 1.5;
    color: #4b5563;
    flex: 1;
    -webkit-app-region: no-drag;
  }
  .actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 14px;
    -webkit-app-region: no-drag;
  }
  button {
    -webkit-app-region: no-drag;
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button:active { transform: scale(0.97); }
  #btnWork {
    background: linear-gradient(135deg, #f97316, #ea580c);
    color: #fff;
    box-shadow: 0 4px 12px rgba(234,88,12,0.3);
  }
  #btnWork:hover { box-shadow: 0 6px 16px rgba(234,88,12,0.45); }
  #btnDismiss {
    background: #f3f4f6;
    color: #4b5563;
  }
  #btnDismiss:hover { background: #e5e7eb; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </div>
    <h1>Idle Time Alert</h1>
    <p>You have been inactive for a while. Click below to confirm you are active and keep your attendance tracking on time.</p>
    <div class="actions">
      <button id="btnDismiss">Dismiss</button>
      <button id="btnWork">I'm Working</button>
    </div>
  </div>
  <script>
    document.getElementById('btnWork').addEventListener('click', () => {
      if (window.idleAlert) window.idleAlert.confirmActive();
      else window.close();
    });
    document.getElementById('btnDismiss').addEventListener('click', () => {
      if (window.idleAlert) window.idleAlert.dismiss();
      else window.close();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (window.idleAlert) window.idleAlert.confirmActive();
        else window.close();
      }
      if (e.key === 'Escape') {
        if (window.idleAlert) window.idleAlert.dismiss();
        else window.close();
      }
    });
  </script>
</body>
</html>
